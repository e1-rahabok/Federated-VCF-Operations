<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Federated VCF Operations Portal</title>
    <style>
      :root {
        --bg-main: #0f172a;
        --panel-bg: #1e293b;
        --border-color: #334155;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --accent-blue: #3b82f6;
        --accent-red: #ef4444;
        --accent-amber: #f59e0b;
        --accent-green: #10b981;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        min-height: 100vh;
      }

      a { color: var(--accent-blue); text-decoration: none; }
      a:hover { text-decoration: underline; }

      button {
        cursor: pointer;
        font-family: inherit;
        font-size: 14px;
        border-radius: 6px;
        border: none;
        padding: 8px 16px;
        transition: background-color 0.2s, transform 0.1s;
      }
      button:active { transform: scale(0.98); }

      .btn-primary { background-color: var(--accent-blue); color: #fff; font-weight: 600; }
      .btn-primary:hover { background-color: #2563eb; }
      .btn-secondary { background-color: #334155; color: #fff; }
      .btn-secondary:hover { background-color: #475569; }

      input, select {
        background-color: #0f172a;
        color: #fff;
        border: 1px solid var(--border-color);
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 14px;
      }
      input:focus, select:focus { outline: 1px solid var(--accent-blue); }

      .panel {
        background-color: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 16px;
      }

      table { width: 100%; border-collapse: collapse; text-align: left; }
      th, td { padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
      th { color: var(--text-muted); font-weight: 600; background-color: #0f172a; }

      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .badge-critical { background-color: #7f1d1d; color: #fca5a5; }
      .badge-warning { background-color: #78350f; color: #fcd34d; }
      .badge-info { background-color: #1e3a8a; color: #93c5fd; }
      .badge-healthy { background-color: #064e3b; color: #6ee7b7; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
