name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate YAML Configuration Syntax
        run: |
          python3 -c "import yaml; yaml.safe_load(open('Configuration/metrics_list.yaml'))"
          python3 -c "import yaml; yaml.safe_load(open('Configuration/alerts_list.yaml'))"

      - name: Verify Requirements & Architecture Specs Exist
        run: |
          test -f Documentation/Requirements.md
          test -f Documentation/Solution.md
